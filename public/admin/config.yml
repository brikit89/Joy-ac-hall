# Decap CMS configuration for Joy AC Hall & Rooms
# Docs: https://decapcms.org/docs/configuration-options/

# ─── BACKEND ───────────────────────────────────────────────────────────
# GitHub backend — content commits go to your repo's main branch.
# The OAuth proxy below is the Cloudflare Worker in cloudflare-worker/.
backend:
  name: github
  repo: brikit89/Joy-ac-hall   # was Ozzitech/Joy-ac-hall
  branch: main
  base_url: https://joy-ac-hall-cms-oauth.brikit-38a.workers.dev
  auth_endpoint: auth

# Local proxy for in-development editing without GitHub
# Run with: npm run cms:proxy
local_backend: true

# ─── PUBLISHING ────────────────────────────────────────────────────────
publish_mode: simple           # use "editorial_workflow" if you want PR-based drafts
media_folder: public/uploads   # where uploaded images are stored
public_folder: /uploads        # path the site uses to reference them
site_url: https://joyachall.com
display_url: https://joyachall.com
logo_url: /logo-coloured.png

# ─── COLLECTIONS ───────────────────────────────────────────────────────
collections:
  # ── 1. Site config (hero text, contact info) ───
  - name: site
    label: Site Settings
    files:
      - file: client/data/site.json
        label: Site Settings
        name: settings
        format: json
        fields:
          - { name: phone, label: "Phone (E.164)", widget: string }
          - { name: phoneDisplay, label: "Phone (display format)", widget: string }
          - { name: whatsapp, label: "WhatsApp number (no spaces)", widget: string }
          - { name: bookingCtaLabel, label: "Header CTA label", widget: string, default: "Book Now", hint: "Shown on the header button (e.g. Book Now)." }
          - { name: bookingUrl, label: "Booking link (Header CTA)", widget: string, hint: "Full URL opened by the header Book Now button." }
          - { name: email, label: "Email", widget: string }
          - { name: address, label: "Full address", widget: text }
          - { name: googleMapsUrl, label: "Google Maps place URL", widget: string }
          - { name: googleReviewsUrl, label: "Google reviews URL", widget: string }
          - { name: heroTitle, label: "Hero title", widget: string }
          - { name: heroSubtitle, label: "Hero subtitle", widget: text }
          - { name: aboutTitle, label: "About section title", widget: string }
          - { name: aboutBody, label: "About section body", widget: markdown }

  # ── 2. Rooms ─────────────────────────────────────
  - name: rooms
    label: Rooms
    label_singular: Room
    folder: client/data/rooms
    format: json
    create: true
    delete: false
    extension: json
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { name: id, label: "ID (unique number — use next free id, e.g. 4)", widget: number }
      - {
          name: order,
          label: "Display order on homepage (lowest first)",
          widget: number,
          default: 99,
        }
      - { name: name, label: "Name", widget: string }
      - { name: slug, label: "URL slug (e.g. dormitory-hall)", widget: string, hint: "Used in the URL: /rooms/<slug>. Lowercase, hyphens only." }
      - { name: capacity, label: "Capacity (display text, e.g. '8 persons')", widget: string }
      - name: occupancy
        label: "Occupancy (for schema.org)"
        widget: object
        hint: "Fill 'value' for a fixed count, OR 'minValue' + 'maxValue' for a range. Used in JSON-LD only."
        fields:
          - { name: value, label: "Exact occupancy", widget: number, required: false }
          - { name: minValue, label: "Min occupancy (range)", widget: number, required: false }
          - { name: maxValue, label: "Max occupancy (range)", widget: number, required: false }
      - { name: price, label: "Price (display, e.g. 'Rs. 250')", widget: string }
      - { name: priceNumeric, label: "Price (number, e.g. 250)", widget: number, hint: "Used in JSON-LD Offer schema." }
      - { name: priceType, label: "Price type ('per room' or 'per person')", widget: string }
      - { name: priceTypeNote, label: "Price type note (e.g. 'AC' / 'Non AC')", widget: string, required: false, hint: "Shown in parentheses next to the price type on the card and detail page. Leave blank to omit." }
      - { name: description, label: "Hero description (appears on detail page)", widget: text }
      - {
          name: features,
          label: "Features (shown on homepage card + detail page)",
          widget: list,
          field: { name: feature, label: "Feature", widget: string },
        }
      - { name: image, label: "Card image URL (homepage thumbnail)", widget: string }
      - {
          name: sliderImages,
          label: "Slider image URLs (detail page gallery)",
          widget: list,
          field: { name: url, label: "URL", widget: string },
        }
      - {
          name: sliderVideos,
          label: "Slider video URLs",
          required: false,
          widget: list,
          field: { name: url, label: "URL", widget: string },
        }
      - {
          name: roomTypes,
          label: "Room types (e.g. AC Dormitory / Non-AC Dormitory)",
          widget: list,
          field: { name: type, label: "Type", widget: string },
        }
      - {
          name: amenityFeatures,
          label: "Schema.org amenity tags",
          widget: list,
          hint: "Used in JSON-LD only — short canonical names like 'AC / Non-AC', 'Hot Water'.",
          field: { name: amenity, label: "Amenity", widget: string },
        }
      - name: faqs
        label: "FAQs (shown on this room's detail page)"
        widget: list
        fields:
          - { name: question, label: Question, widget: string }
          - { name: answer, label: Answer, widget: text }

  # ── 3. Attractions (home page) ───────────────────
  - name: attractions
    label: Attractions
    files:
      - file: client/data/attractions.json
        label: Attractions list
        name: list
        format: json
        fields:
          - name: items
            label: Attractions
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: distance, label: Distance, widget: string }
              - { name: travelTime, label: Travel time, widget: string }
              - { name: visitorTime, label: Visitor hours, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: image, label: Image URL, widget: string }

  # ── 4. FAQs (home page) ──────────────────────────
  - name: faqs
    label: FAQs
    files:
      - file: client/data/faqs.json
        label: FAQ list
        name: list
        format: json
        fields:
          - name: items
            label: Questions
            widget: list
            fields:
              - { name: question, label: Question, widget: string }
              - { name: answer, label: Answer, widget: text }

  # ── 5. Reviews ───────────────────────────────────
  - name: reviews
    label: Google Reviews
    files:
      - file: client/data/reviews.json
        label: Reviews list
        name: list
        format: json
        fields:
          - name: items
            label: Reviews
            widget: list
            fields:
              - { name: author, label: Author, widget: string }
              - { name: time, label: "Time (e.g. a week ago)", widget: string }
              - { name: rating, label: "Rating (1-5)", widget: number, min: 1, max: 5 }
              - { name: text, label: Review text, widget: text }
